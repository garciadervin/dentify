<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.5/dist/tf-tflite.min.js"></script>
  <title>YOLO Inference</title>
</head>
<body>
<script>
// ── Model State ──────────────────────────────────────────────────────────
let _model = null;
let _modelLoaded = false;
// Must match assets/ml/metadata.yaml `names` exactly (classId ↔ label).
const CLASS_NAMES = ['Abrasion', 'Filling', 'Crown', 'Caries 1 class', 'Caries 2 class', 'Caries 3 class', 'Caries 4 class', 'Caries 5 class', 'Caries 6 class'];
const MODEL_INPUT_SIZE = 640;
const CONFIDENCE_THRESHOLD = 0.25;
const IOU_THRESHOLD = 0.45;
const MAX_DETECTIONS = 100;

// ── Helpers ──────────────────────────────────────────────────────────────
function sigmoid(x) { return 1 / (1 + Math.exp(-x)); }

function computeIoU(a, b) {
  const [ax, ay, aw, ah] = a;
  const [bx, by, bw, bh] = b;
  const ax1 = ax - aw / 2, ay1 = ay - ah / 2, ax2 = ax + aw / 2, ay2 = ay + ah / 2;
  const bx1 = bx - bw / 2, by1 = by - bh / 2, bx2 = bx + bw / 2, by2 = by + bh / 2;
  const ix1 = Math.max(ax1, bx1), iy1 = Math.max(ay1, by1);
  const ix2 = Math.min(ax2, bx2), iy2 = Math.min(ay2, by2);
  const iw = Math.max(0, ix2 - ix1), ih = Math.max(0, iy2 - iy1);
  const inter = iw * ih, union = aw * ah + bw * bh - inter;
  return union > 0 ? inter / union : 0;
}

function nms(boxes, scores, threshold) {
  const indices = scores.map((s, i) => ({ s, i })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.i);
  const keep = [];
  for (const idx of indices) {
    let shouldKeep = true;
    for (const keptIdx of keep) {
      if (computeIoU(boxes[idx], boxes[keptIdx]) > threshold) { shouldKeep = false; break; }
    }
    if (shouldKeep) keep.push(idx);
  }
  return keep;
}

// ── Model Load ───────────────────────────────────────────────────────────
async function loadModel(modelData) {
  try {
    await tf.ready();
    _model = await tflite.loadTFLiteModel(modelData);
    _modelLoaded = true;
    postMessage({ type: 'model-loaded' });
  } catch (err) {
    postMessage({ type: 'model-error', error: err.message });
  }
}

// ── Inference ────────────────────────────────────────────────────────────
async function runInference(imageData) {
  if (!_model) { postMessage({ type: 'inference-error', error: 'Model not loaded' }); return; }

  try {
    // Decode image
    const img = new Image();
    img.src = imageData;
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });

    // Convert to tensor and preprocess
    const tensor = tf.browser.fromPixels(img);
    const resized = tf.image.resizeBilinear(tensor, [MODEL_INPUT_SIZE, MODEL_INPUT_SIZE]);
    const normalized = tf.div(resized, 255.0);
    const batched = normalized.expandDims(0);
    tensor.dispose(); resized.dispose(); normalized.dispose();

    // Run model
    const output = await _model.predict(batched);
    batched.dispose();

    const data = await output.data();
    const shape = output.shape;
    output.dispose();

    const numClasses = CLASS_NAMES.length;
    const rawDets = [];

    // Reads class scores for detection at offset `off` (row stride `stride`).
    const bestClass = (off) => {
      let maxConf = 0, cls = -1;
      for (let c = 0; c < numClasses; c++) {
        const conf = sigmoid(data[off + 4 + c]);
        if (conf > maxConf) { maxConf = conf; cls = c; }
      }
      return { maxConf, cls };
    };
    const pushDet = (off) => {
      const { maxConf, cls } = bestClass(off);
      if (maxConf > CONFIDENCE_THRESHOLD && cls >= 0) {
        rawDets.push({
          bbox: [data[off]/MODEL_INPUT_SIZE, data[off+1]/MODEL_INPUT_SIZE, data[off+2]/MODEL_INPUT_SIZE, data[off+3]/MODEL_INPUT_SIZE],
          confidence: maxConf,
          classId: cls,
        });
      }
    };

    const dim = shape.length >= 3 ? shape[1] || 0 : 0;
    const stride = shape.length >= 3 ? shape[2] || 0 : 0;

    if (dim > 0 && stride === 6) {
      // end2end single-class: [x, y, w, h, conf, cls]
      for (let i = 0; i < dim; i++) {
        const off = i * 6;
        const conf = data[off + 4], cls = Math.round(data[off + 5]);
        if (conf > CONFIDENCE_THRESHOLD && cls >= 0 && cls < numClasses) {
          rawDets.push({ bbox: [data[off]/MODEL_INPUT_SIZE, data[off+1]/MODEL_INPUT_SIZE, data[off+2]/MODEL_INPUT_SIZE, data[off+3]/MODEL_INPUT_SIZE], confidence: conf, classId: cls });
        }
      }
    } else if (stride >= 4 + numClasses) {
      if (dim > stride) {
        // candidate list (end2end, NMS baked in): [1, N, 4+nc(+mask coeffs)]
        for (let i = 0; i < dim; i++) pushDet(i * stride);
      } else {
        // dense grid (non-end2end): [1, 4+nc(+mask coeffs), N] — transposed
        for (let c = 0; c < stride; c++) pushDet(c * dim);
      }
    } else {
      // flattened fallback: [x, y, w, h, conf, cls] per 6 values
      const flatSize = data.length;
      const possible = Math.min(Math.floor(flatSize / 6), MAX_DETECTIONS);
      for (let i = 0; i < possible; i++) {
        const off = i * 6;
        const conf = sigmoid(data[off + 4]), cls = Math.round(data[off + 5]);
        if (conf > CONFIDENCE_THRESHOLD && cls >= 0 && cls < numClasses) {
          rawDets.push({ bbox: [data[off]/MODEL_INPUT_SIZE, data[off+1]/MODEL_INPUT_SIZE, data[off+2]/MODEL_INPUT_SIZE, data[off+3]/MODEL_INPUT_SIZE], confidence: conf, classId: cls });
        }
      }
    }

    // NMS
    const boxes = rawDets.map(d => d.bbox);
    const scores = rawDets.map(d => d.confidence);
    const keep = nms(boxes, scores, IOU_THRESHOLD);

    const detections = keep.map(idx => ({
      classId: rawDets[idx].classId,
      className: CLASS_NAMES[rawDets[idx].classId] || 'Unknown',
      confidence: rawDets[idx].confidence,
      bbox: rawDets[idx].bbox,
    }));
    detections.sort((a, b) => b.confidence - a.confidence);

    postMessage({ type: 'inference-result', detections });
  } catch (err) {
    postMessage({ type: 'inference-error', error: err.message });
  }
}

// ── Message Handler ──────────────────────────────────────────────────────
self.addEventListener('message', (event) => {
  const msg = event.data;
  switch (msg.type) {
    case 'load-model':
      loadModel(msg.modelData);
      break;
    case 'run-inference':
      runInference(msg.imageData);
      break;
  }
});

// Signal ready
postMessage({ type: 'ready' });
</script>
</body>
</html>
